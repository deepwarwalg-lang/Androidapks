name: Build Android APK on: workflow_dispatch: jobs: build: runs-on: ubuntu-latest steps: - name: Checkout repository uses: actions/checkout@v4 - name: Find and extract ZIP run: | ZIP_FILE=$(find . -maxdepth 2 -name 'AndroidForge_safe_build_patch*.zip' -print -quit if" ]; then echo "Project ZIP not found" and exit 1; mkdir project; unzip -o "$ZIP_FILE" -d project - name: Locate Gradle project run: | SETTINGS=$(find project -name settings.gradle.kts -print -quit) if; then echo "settings.gradle.kts not found" and exit 1; echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV" - name: Setup Java uses: actions/setup-java@v4 with: distribution: temurin java-version: '17' - name: Setup Gradle uses: gradle/actions/setup-gradle@v4 with: gradle-version: '9.3.1' - name: Build APK run: gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug - name: Upload APK uses: actions/upload-artifact@v4 with: name: app-debug path: project/**/app/build/outputs/apk/debug/app-debug.apk
